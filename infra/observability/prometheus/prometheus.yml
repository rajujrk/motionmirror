global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /run/mm/metrics-token
    static_configs:
      - targets: ["api:8081"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
