# Dataset registry. Record only what a primary source or the downloaded files show.
# commercial_use_ok defaults to false. Removing an entry invalidates adapters trained on it until reviewed.
schema_version: 1
datasets:
  - id: tiktok-dance
    name: TikTok Dance Dataset (Jafarian and Park, CVPR 2021)
    version: kaggle-2021-09-22
    use: Single-person dance videos, the closest match to the product's input
    primary_url: https://www.kaggle.com/datasets/yasaminjafarian/tiktokdataset
    fallback_url: null
    access: kaggle
    source_ref: yasaminjafarian/tiktokdataset
    license_name: CC BY-NC 4.0
    license_url: https://creativecommons.org/licenses/by-nc/4.0/
    license_notes: >-
      Verbatim from License.pdf inside the download: "The code and the data will not be transferred to outside parties without the
      authors' permission and will be used only for research purposes. In particular, the code or TikTok dataset will not be included
      as part of any commercial software package or product of this institution." and "This work and dataset is licensed under a
      Creative Commons Attribution-NonCommercial 4.0 International License." Clips show real people who have not individually
      consented to this use. Copying this data to a third-party GPU provider may count as a transfer; get the authors' permission first.
    commercial_use_ok: false
    transfer_requires_permission: true
    attribution: "Jafarian and Park, Learning High Fidelity Depths of Dressed Humans by Watching Social Media Dance Videos, CVPR 2021"
    consent_notes: Real people's likeness. Research adapters only, never promoted to production.
    size_bytes: 48622644842
    checksum_manifest: .data/datasets/tiktok-dance/MANIFEST.json
    retrieval_date: "2026-11-06"
    review:
      status: approved
      scope: research_only
      reviewer: Product owner
      review_date: "2026-11-06"
      decision: Keep the brief's rule. Train only clearly labelled research adapters on this data.

