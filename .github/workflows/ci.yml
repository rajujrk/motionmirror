# Runs without any secrets or spending. Actions are pinned to reviewed commits, and each job gets only what it needs.
# Not yet run: this repository has no remote. Linux runs everything, while the Mac and Windows jobs run what those
# runners can, because hosted Mac and Windows runners have no Docker daemon for the service tests.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: {version: 10.14.0}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 26.13.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @motionmirror/web exec tsc --noEmit
      - run: pnpm --filter @motionmirror/web exec eslint src
      - run: pnpm --filter @motionmirror/web exec vitest run
      - run: pnpm --filter @motionmirror/web build

  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: {distribution: temurin, java-version: "21", cache: maven}
      # Real PostgreSQL, RabbitMQ, Redis and storage through Testcontainers.
      - run: cd apps/api && ./mvnw -B test -Dtest='*IT,*Test'

  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cd services/ml-worker && uv sync --extra wan --extra preprocess --group dev
      - run: cd services/ml-worker && uv run ruff check src tests
      - run: cd services/ml-worker && uv run ruff format --check src tests
      - run: cd services/ml-worker && uv run pytest tests/unit tests/contract tests/integration -q

  training:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cd training && uv sync --group dev
      - run: cd training && uv run ruff check src tests
      - run: cd training && uv run pytest tests -q

  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Windows reads files as cp1252 unless told otherwise, so a read without an encoding fails everywhere.
      - run: uv run --with pytest --with pyyaml --no-project pytest tests/tools -q -W error::EncodingWarning
        env:
          PYTHONWARNDEFAULTENCODING: "1"

  mac-worker:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: brew install ffmpeg
      - run: cd services/ml-worker && uv sync --extra wan --extra preprocess --group dev
      - run: cd services/ml-worker && uv run pytest tests/unit tests/contract -q

  journey:
    runs-on: ubuntu-24.04
    needs: [web, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: {version: 10.14.0}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 26.13.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make up-mock
      - run: make test-e2e
      - if: failure()
        run: docker compose --env-file .env -f infra/compose/compose.yaml --profile lite logs --tail=200

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      # Trivy reads Maven dependencies from this cache, because Maven Central rate-limits direct lookups.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: make scan
